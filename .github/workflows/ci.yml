name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore HomelabOrchestrator.sln

      - name: Build
        run: dotnet build HomelabOrchestrator.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test HomelabOrchestrator.sln --no-build --configuration Release

      - name: Verify formatting
        run: dotnet format HomelabOrchestrator.sln --verify-no-changes --no-restore

  ansible:
    name: Ansible validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check playbooks
        working-directory: ansible
        run: |
          set -euo pipefail

          for playbook in playbooks/*.yml; do
            echo "::group::Checking ${playbook}"
            ansible-playbook \
              --syntax-check \
              -i 'localhost,' \
              "${playbook}"
            echo "::endgroup::"
          done
